---
- name: Napravi direktorij aplikacije
  ansible.builtin.file:
    path: /opt/ruo
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Prenesi aplikaciju na server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/"
    dest: /opt/ruo/
    owner: root
    group: root
    mode: preserve
  register: app_source

- name: Generisi i postavi konfiguraciju aplikacije
  ansible.builtin.template:
    src: app.env.j2
    dest: /opt/ruo/.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

- name: Izgradi slike i pokreni aplikaciju
  community.docker.docker_compose_v2:
    project_src: /opt/ruo
    files:
      - compose.yaml
    state: present
    build: "{{ 'always' if app_source.changed else 'policy' }}"
    wait: true
    wait_timeout: 600
  no_log: true